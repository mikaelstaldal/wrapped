name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # Not the default shell: this gets pipefail, without which the exit status of
    # "go test | tee" below would be tee's and a failing test would pass silently.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # bubblewrap provides bwrap, passt provides pasta, nftables provides nft.
      # curl is the program the filtered-network tests run inside the sandbox.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap passt nftables curl
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Ubuntu restricts unprivileged user namespaces via AppArmor, which stops
      # bwrap and pasta from creating the namespaces the sandbox is built on.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Show tool versions
        run: |
          bwrap --version
          pasta --version
          nft --version
          curl --version

      - name: Build
        run: |
          go build -tags netgo ./...
          go build -tags netgo -o "$RUNNER_TEMP/wrapped" ./cmd/wrapped

      - name: Lint
        run: golangci-lint run ./...

      - name: Check for known vulnerabilities
        run: govulncheck ./...

      # The integration tests skip themselves when the sandbox does not work, so
      # exercise each network mode here first. A broken environment then fails
      # immediately with bwrap's or pasta's own error message, rather than being
      # reported later only as an unexplained skip.
      - name: Verify the sandbox works
        run: |
          echo '--- network none ---'
          "$RUNNER_TEMP/wrapped" -- /usr/bin/true
          echo '--- network host ---'
          "$RUNNER_TEMP/wrapped" --network host -- /usr/bin/true
          echo '--- network bridge ---'
          "$RUNNER_TEMP/wrapped" --network bridge -- /usr/bin/true
          echo '--- network filtered ---'
          "$RUNNER_TEMP/wrapped" --allow-host example.com -- /usr/bin/true

      - name: Test
        run: go test ./... -v -timeout 15m 2>&1 | tee test-output.txt

      # The integration tests skip themselves when bwrap, pasta, nft or network
      # access is unavailable. That is right for a developer machine, but in CI a
      # skip means this workflow is not actually exercising the sandbox, so treat
      # any skip as a failure rather than letting it pass unnoticed.
      - name: Fail on skipped tests
        run: |
          if grep --quiet '^--- SKIP' test-output.txt; then
            echo "::error::Tests were skipped; the CI environment is missing something the sandbox needs."
            # The reason a test skipped is logged on the lines before its SKIP line.
            grep --before-context=2 --after-context=1 '^--- SKIP' test-output.txt
            exit 1
          fi
          echo "No tests were skipped."
